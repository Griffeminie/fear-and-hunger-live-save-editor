# When you publish a release on GitHub, this builds the download zip and attaches it to the release.
name: Attach zip to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: git archive --format=zip --prefix=termina-save-editor/ -o "termina-save-editor-${{ github.event.release.tag_name }}.zip" HEAD
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "termina-save-editor-${{ github.event.release.tag_name }}.zip" --clobber
